name: flaha_inspect
description: FlahaINSPECT field app. Flutter sibling — not a pnpm/turbo package.
publish_to: "none"
version: 0.0.1+1

# Flutter SDK pin for humans. CI reads apps/mobile/.flutter-version (exact).
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  image: ^4.5.4
  crypto: ^3.0.6
  uuid: ^4.5.1
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

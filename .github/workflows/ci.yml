name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  changes:
    name: Identify affected checks
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.paths.outputs.node }}
      compose: ${{ steps.paths.outputs.compose }}
      flutter: ${{ steps.paths.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/ci/affected.sh >> "$GITHUB_OUTPUT"

  node:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.node == 'true') }}
    name: api / web / worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Official actions + corepack only. pnpm/action-setup tarball 429s at Set up job.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Infra contract
        run: pnpm run test:infra
      - name: Build
        run: pnpm build

  compose:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.compose == 'true') }}
    name: docker compose smoke
    env:
      CLIENT_ROLE_ENABLED: 'true'
      COMPOSE_FILE: infra/docker-compose.yml:infra/docker-compose.ci.yml
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Config
        run: |
          cp .env.example .env
          docker compose --env-file .env config >/dev/null
      - name: Up
        run: docker compose --env-file .env up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/health; then
              echo
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file .env logs
          exit 1
      - name: Ready + tusd port
        run: |
          curl -sf http://127.0.0.1:3001/health/ready
          echo
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:1080/files/ | grep -E '200|204|400|404|405'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Migrate twice + seed
        env:
          DATABASE_URL: postgres://flaha:flaha_dev_only@localhost:5433/flaha_inspect
          SEED_PASSWORD: ci-seed-password-only
          NODE_ENV: development
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @flaha/inspect-api db:migrate:twice
          pnpm --filter @flaha/inspect-api db:seed
      - name: Pilot e2e login point tus list PDF
        env:
          WEB_GATE_FIXTURE: ${{ runner.temp }}/web-gate.json
          API_BASE: http://127.0.0.1:3001
          TUSD_URL: http://127.0.0.1:1080/files/
          SEED_PASSWORD: ci-seed-password-only
        run: node infra/e2e/pilot-smoke.mjs
      - name: Browser finding release and revocation
        env:
          WEB_URL: http://127.0.0.1:3000
          API_BASE_URL: http://127.0.0.1:3001
          WEB_GATE_FIXTURE: ${{ runner.temp }}/web-gate.json
          DISPOSABLE_FINDINGS_TEST: '1'
          SEED_PASSWORD: ci-seed-password-only
        run: |
          npm install --prefix "$RUNNER_TEMP/web-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          export PW_RUNTIME="$RUNNER_TEMP/web-browser/node_modules/playwright"
          export CHROME_PATH="$(command -v google-chrome)"
          pnpm --filter @flaha/inspect-web... build
          pnpm --filter @flaha/inspect-web start > "$RUNNER_TEMP/web.log" 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail --silent "$WEB_URL/login" >/dev/null
          node infra/e2e/web-finding-release.cjs
      - name: Hooks are not a host port
        run: |
          published="$(docker compose --env-file .env ps --format json)"
          echo "$published"
          echo "$published" | grep -v '8081'
      - name: Down
        if: always()
        run: docker compose --env-file .env down -v


  reports:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.compose == 'true') }}
    name: report database and issued revision acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: infra/docker-compose.yml:infra/docker-compose.ci.yml
      CLIENT_ROLE_ENABLED: 'true'
      POSTGRES_DB: issued_reports_disposable
      DATABASE_URL: postgres://flaha:flaha_dev_only@127.0.0.1:5433/issued_reports_disposable
      S3_BUCKET: ci-private
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: flaha
      S3_SECRET_KEY: flaha_dev_only_minio
      SEED_PASSWORD: ci-seed-password-only
      NODE_ENV: development
      DISPOSABLE_REPORT_TEST: '1'
      DISPOSABLE_FINDINGS_TEST: '1'
      WEB_URL: http://127.0.0.1:3000
      API_BASE: http://127.0.0.1:3001
      API_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install and build test inputs
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm build
          npm install --prefix "$RUNNER_TEMP/report-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
      - name: Start disposable services
        run: |
          cp .env.example .env
          docker compose --env-file .env config >/dev/null
          docker compose --env-file .env up -d --build
          docker compose --env-file .env exec -T postgres pg_isready -U flaha
      - name: Report queue and metadata database regressions
        run: |
          for suite in queue metadata; do
            database="report_${suite}_disposable"
            docker compose --env-file .env exec -T postgres createdb -U flaha "$database"
            (
              export DATABASE_URL="postgres://flaha:flaha_dev_only@127.0.0.1:5433/$database"
              node apps/api/dist/db/migrate.js --twice
              node apps/api/dist/db/seed.js
              node --test "infra/e2e/report-${suite}.test.cjs"
            )
          done
      - name: Seed fresh issuance database
        run: |
          node apps/api/dist/db/migrate.js --twice
          node apps/api/dist/db/seed.js
      - name: Browser issued revisions and access revocation
        run: |
          export PW_RUNTIME="$RUNNER_TEMP/report-browser/node_modules/playwright"
          export CHROME_PATH="$(command -v google-chrome)"
          export AUDIT_PDF_PATH="$RUNNER_TEMP/issued-acceptance"
          pnpm --filter @flaha/inspect-web start > "$RUNNER_TEMP/report-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          node infra/e2e/issued-report-acceptance.cjs
      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose --env-file .env logs --tail=100
          test ! -f "$RUNNER_TEMP/report-web.log" || tail -100 "$RUNNER_TEMP/report-web.log"
      - name: Down
        if: always()
        run: docker compose --env-file .env down -v

  mobile:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.flutter == 'true') }}
    name: flutter sibling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_ROOT: ${{ github.workspace }}/.tooling/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter pin
        id: flutter_pin
        run: echo "version=$(tr -d '\r\n' < apps/mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}
          key: flutter-${{ runner.os }}-${{ steps.flutter_pin.outputs.version }}
      - name: Install pinned Flutter
        run: |
          set -euo pipefail
          if [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
            git clone --depth 1 --branch "${{ steps.flutter_pin.outputs.version }}" \
              https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Drift
        working-directory: apps/mobile
        run: dart run build_runner build
      - name: Generated Drift files must be committed
        working-directory: apps/mobile
        run: git diff --exit-code
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: apps/mobile
        run: flutter test

# PR-01 CI skeleton. Node workspaces via Turborepo.
# Flutter is a sibling app — separate job, not a turbo pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  node:
    name: api / web / worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Official actions + corepack only. pnpm/action-setup tarball 429s at Set up job.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Infra contract
        run: pnpm run test:infra
      - name: Build
        run: pnpm build

  compose:
    name: docker compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Config
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml --env-file .env config >/dev/null
      - name: Up
        run: docker compose -f infra/docker-compose.yml --env-file .env up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/health; then
              echo
              exit 0
            fi
            sleep 3
          done
          docker compose -f infra/docker-compose.yml --env-file .env logs
          exit 1
      - name: Ready + tusd port
        run: |
          curl -sf http://127.0.0.1:3001/health/ready
          echo
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:1080/files/ | grep -E '200|204|400|404|405'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Migrate twice + seed
        env:
          DATABASE_URL: postgres://flaha:flaha_dev_only@localhost:5433/flaha_inspect
          SEED_PASSWORD: ci-seed-password-only
          NODE_ENV: development
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @flaha/inspect-api db:migrate:twice
          pnpm --filter @flaha/inspect-api db:seed
      - name: Pilot e2e login point tus list PDF
        env:
          API_BASE: http://127.0.0.1:3001
          TUSD_URL: http://127.0.0.1:1080/files/
          SEED_PASSWORD: ci-seed-password-only
        run: node infra/e2e/pilot-smoke.mjs
      - name: Hooks are not a host port
        run: |
          published="$(docker compose -f infra/docker-compose.yml --env-file .env ps --format json)"
          echo "$published"
          echo "$published" | grep -v '8081'
      - name: Down
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down -v

  mobile:
    name: flutter sibling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_ROOT: ${{ github.workspace }}/.tooling/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter pin
        id: flutter_pin
        run: echo "version=$(tr -d '\r\n' < apps/mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}
          key: flutter-${{ runner.os }}-${{ steps.flutter_pin.outputs.version }}
      - name: Install pinned Flutter
        run: |
          set -euo pipefail
          if [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
            git clone --depth 1 --branch "${{ steps.flutter_pin.outputs.version }}" \
              https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Drift
        working-directory: apps/mobile
        run: dart run build_runner build
      - name: Generated Drift files must be committed
        working-directory: apps/mobile
        run: git diff --exit-code
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: apps/mobile
        run: flutter test

# PR-01 CI skeleton. Node workspaces via Turborepo.
# Flutter is a sibling app — separate job, not a turbo pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  node:
    name: api / web / worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Infra contract
        run: pnpm run test:infra
      - name: Build
        run: pnpm build

  compose:
    name: docker compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Config
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml --env-file .env config >/dev/null
      - name: Up
        run: docker compose -f infra/docker-compose.yml --env-file .env up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/health; then
              echo
              exit 0
            fi
            sleep 3
          done
          docker compose -f infra/docker-compose.yml --env-file .env logs
          exit 1
      - name: Ready + tusd port
        run: |
          curl -sf http://127.0.0.1:3001/health/ready
          echo
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:1080/files/ | grep -E '200|204|400|404|405'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Migrate twice + seed
        env:
          DATABASE_URL: postgres://flaha:flaha_dev_only@localhost:5433/flaha_inspect
          SEED_PASSWORD: ci-seed-password-only
          NODE_ENV: development
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @flaha/inspect-api db:migrate:twice
          pnpm --filter @flaha/inspect-api db:seed
      - name: Hooks are not a host port
        run: |
          published="$(docker compose -f infra/docker-compose.yml --env-file .env ps --format json)"
          echo "$published"
          echo "$published" | grep -v '8081'
      - name: Down
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down -v

  mobile:
    name: flutter sibling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter pin
        id: flutter_pin
        run: echo "version=$(tr -d '\r\n' < apps/mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Generate Drift
        run: dart run build_runner build
      - name: Generated Drift files must be committed
        run: git diff --exit-code
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

# Disposable CI storage. Keep the internal hostname for existing S3 clients.
services:
  minio:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    entrypoint: ["weed"]
    command: ["server", "-dir=/data", "-ip=minio", "-ip.bind=0.0.0.0", "-s3", "-s3.port=9000", "-s3.config=/etc/ci-s3.json", "-s3.port.iceberg=0", "-s3.port.lance=0", "-master.volumeSizeLimitMB=8", "-volume.max=12"]
    configs:
      - source: ci_s3
        target: /etc/ci-s3.json
    volumes: !override
      - ci_objects:/data
    ports: !reset []
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9333/cluster/status"]

  minio-init:
    image: amazon/aws-cli:2.31.0@sha256:3b018ce74732c98acf6f1de59b3a89587cb7f9eb6ea0d1447d1779091b2bf057
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_EC2_METADATA_DISABLED: "true"
    volumes: !reset []
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        s3() { aws --endpoint-url http://minio:9000 s3api "$$@"; }
        i=0
        until s3 list-buckets >/dev/null; do
          i=$$((i + 1))
          [ "$$i" -lt 30 ] || exit 1
          sleep 2
        done
        s3 head-bucket --bucket "$$S3_BUCKET" || s3 create-bucket --bucket "$$S3_BUCKET"
        s3 put-bucket-versioning --bucket "$$S3_BUCKET" --versioning-configuration Status=Enabled
        test "$$(s3 get-bucket-versioning --bucket "$$S3_BUCKET" --query Status --output text)" = Enabled
        if error=$$(s3 list-objects-v2 --bucket "$$S3_BUCKET" --no-sign-request 2>&1); then exit 1; fi
        echo "$$error" | grep -q AccessDenied

configs:
  ci_s3:
    content: |
      {"identities":[{"name":"ci","credentials":[{"accessKey":"${S3_ACCESS_KEY:?}","secretKey":"${S3_SECRET_KEY:?}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  ci_objects:

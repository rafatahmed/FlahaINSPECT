# FlahaINSPECT local data plane (PR-02).
# Published to the host: Postgres 5432, MinIO 9000/9001, tusd uploads 1080, API 3001.
# NOT published: tusd hook traffic (api:3001/internal/tus on the compose network only).
# Durable jobs stay in Postgres (KD-17) — no extra broker.

name: flaha-inspect

services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [flaha]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [flaha]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [flaha]
    restart: "no"

  tusd:
    image: tusproject/tusd:v2.8.0
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION}
    # Upload port is published. Hooks are outbound from this container to api:3001
    # on the compose network — there is no hook listener port on the host.
    command:
      - "-port=8080"
      - "-base-path=/files/"
      - "-max-size=${TUSD_MAX_SIZE:-26214400}"
      - "-s3-bucket=${S3_BUCKET}"
      - "-s3-endpoint=http://minio:9000"
      - "-s3-disable-ssl"
      - "-s3-object-prefix=uploads/"
      - "-hooks-http=http://api:3001/internal/tus?secret=${TUSD_HOOK_SECRET}"
      - "-hooks-enabled-events=pre-create,post-finish"
    ports:
      - "${TUSD_PORT:-1080}:8080"
    networks: [flaha]

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: api
        PKG: "@flaha/inspect-api"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
      TUSD_PUBLIC_URL: ${TUSD_PUBLIC_URL}
      TILE_PROVIDER_URL: ${TILE_PROVIDER_URL}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [flaha]

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: worker
        PKG: "@flaha/inspect-worker"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
    networks: [flaha]

networks:
  flaha:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
